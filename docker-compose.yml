
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.v1
    image: dm-api:v1
    environment:
      - PORT=${PORT}
    ports:
      - "3001:3000"

  swagger:
    image: swaggerapi/swagger-ui:latest
    environment:
    - URLS=[{"url":"/openapi/openapi.yaml","name":"Dernier Métro API"}]
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro
    ports:
      - "8080:8080"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: